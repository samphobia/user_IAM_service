spring:
  datasource:
    url: jdbc:h2:mem:creditdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

integration:
  iam:
    base-url: http://localhost:8090

encryption:
  key: 0123456789abcdef
